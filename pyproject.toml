[project]
name = "orchsketch"
version = "1.0"
description = "Orchestral sketching assistant: block-chord MIDI in, rule-checked orchestrations out."
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["slow: the biggest generator sweeps; run_tests.bat skips them, release.bat runs everything"]
